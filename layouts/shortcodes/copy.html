{{ $text := .Get "text" }}
{{ $label := .Get "label" | default "复制" }}
{{ $id := printf "copy-%s" (delimit (split (now.Format "20060102150405.000000000") ".") "") }}
{{ with $text }}
<button class="cp-btn" data-cp="{{ . }}" type="button">{{ $label }}</button>
{{ else }}
<div class="cp-wrap" id="{{ $id }}">
  <div class="cp-content">{{ $.Inner }}</div>
  <button class="cp-btn-inline" data-cp-target="{{ $id }}" type="button">{{ $label }}</button>
</div>
{{ end }}
<style>
.cp-btn,.cp-btn-inline{padding:4px 14px;border:none;border-radius:6px;background:#2e5ff7;color:#fff;cursor:pointer;font-size:.88em}
.cp-btn:hover,.cp-btn-inline:hover{background:#1d47c9}
.cp-wrap{position:relative;padding:10px 14px;border:1px solid #d0d7de;border-radius:8px;background:#f8fbff;margin:1em 0}
.cp-content{padding-right:80px}
.cp-btn-inline{position:absolute;top:8px;right:8px}
</style>
<script>
(function(){
if(window.__cpBtnBound)return;window.__cpBtnBound=true;
document.addEventListener('click',function(e){
var btn=e.target.closest('.cp-btn,.cp-btn-inline');if(!btn)return;
var text=btn.getAttribute('data-cp')||'';
if(!text){
var tid=btn.getAttribute('data-cp-target');var box=document.getElementById(tid);
if(box)text=box.querySelector('.cp-content').textContent.trim();
}
if(!text)return;
function ok(){var orig=btn.textContent;btn.textContent='已复制';setTimeout(function(){btn.textContent=orig;},1500);}
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,function(){fallback(text,btn);});}else{fallback(text,btn);}
function fallback(t,b){var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');var orig=b.textContent;b.textContent='已复制';setTimeout(function(){b.textContent=orig;},1500);}catch(err){}ta.remove();}
});
})();
</script>
