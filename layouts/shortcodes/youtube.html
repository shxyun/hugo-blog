{{ $url := .Get "url" }}
{{ $id := .Get "id" }}
{{ $title := .Get "title" | default "YouTube Video" }}
{{ if and (not $id) $url }}
  {{ $id = replaceRE "(?:.*youtu\\.be/|.*[?&]v=)([^&]+).*" "${1}" $url }}
{{ end }}
<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;margin:1.5em 0;max-width:720px;">
  <iframe src="https://www.youtube.com/embed/{{ $id }}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;" allowfullscreen title="{{ $title }}"></iframe>
</div>
