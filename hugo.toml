baseURL = "https://blog.shenlijun.cn/"
locale = "zh-cn"
title = "沈立军的博客"
theme = "PaperMod"
paginate = 10
enableRobotsTXT = true
[params]
  author = "沈立军"
  [params.socialIcons]
    [[params.socialIcons]]
      name = "github"
      url = "https://github.com/shxyun"
  description = "记录技术、思考与生活"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  [params.homeInfoParams]
    Title = "你好，我是沈立军 👋"
    Content = "欢迎来到我的博客，这里记录技术、思考与生活。"
[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
